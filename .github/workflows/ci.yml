name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        install-mode: ["editable", "standard"]
        include:
          # Only run non-editable install once (on 3.12) to save time
          - python-version: "3.12"
            install-mode: "standard"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (editable)
        if: matrix.install-mode == 'editable'
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"

      - name: Install project (standard)
        if: matrix.install-mode == 'standard'
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build and verify the wheel contains the package
        run: |
          python -m pip wheel --no-deps . -w dist
          python -c "import glob, zipfile; names = zipfile.ZipFile(sorted(glob.glob('dist/*.whl'))[0]).namelist(); assert any(n.startswith('acfm_system/') for n in names), names"

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t acfm-net .

      - name: Verify image runs
        run: |
          docker run --rm -d --name acfm-test -p 8000:8000 \
            -e ACFM_MODEL_PATH=/app/models/fatigue.joblib \
            -e ACFM_ALLOWED_ORIGIN=http://localhost:3000 \
            acfm-net
          sleep 10
          curl -fsS http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          docker stop acfm-test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm test
