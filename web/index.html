<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACFM-Net Monitor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>ACFM-Net</h1>
    <p>Adaptive Cognitive and Fatigue Monitoring System</p>
    <video id="camera" autoplay playsinline></video>
    <canvas id="frame" hidden></canvas>
    <div class="controls">
      <label><input id="consent" type="checkbox">
        I consent to temporary camera-frame analysis. Frames are not stored.</label>
      <div class="controls">
        <button id="start">Start camera</button>
        <button id="stop" disabled>Stop camera</button>
        <button id="analyze" disabled>Analyze window</button>
      </div>
    </div>
    <section id="result" aria-live="polite">Camera is off.</section>
    <small>Frame-window estimate only. This is not a medical diagnosis or safety guarantee.</small>
  </main>
  <script src="/app.js"></script>
</body>
</html>
