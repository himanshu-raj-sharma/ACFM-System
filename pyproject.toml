[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "acfm-net"
version = "0.1.0"
description = "Adaptive Cognitive and Fatigue Monitoring System."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Himanshu Raj" }]
dependencies = [
    "flask>=3.0,<4",
    "flask-limiter>=3.5,<4",
    "gunicorn>=21,<24",
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
acfm-net = "acfm_system.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["acfm_system"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]
# Import from the repository checkout explicitly; never rely on the accident
# that "python -m pytest" puts the current working directory on sys.path.
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
